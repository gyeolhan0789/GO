name: wecandoit-backend-prod

services:
  mysql:
    image: mysql:8.0
    container_name: wecandoit-mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: wecandoit
      MYSQL_USER: wecandoit
      MYSQL_PASSWORD: ***REMOVED***
      MYSQL_ROOT_PASSWORD: ***REMOVED***
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p***REMOVED***"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wecandoit-redis-prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    image: wecandoit-backend-prod
    container_name: wecandoit-backend-prod
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wecandoit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: wecandoit
      SPRING_DATASOURCE_PASSWORD: ***REMOVED***
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql-data:
  redis-data:
