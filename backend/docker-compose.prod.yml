name: wecandoit-backend-prod

x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wecandoit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  SPRING_DATASOURCE_USERNAME: wecandoit
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  STORAGE_ROOT_PATH: /app/uploads
  JWT_SECRET: ${JWT_SECRET}

x-backend-common: &backend-common
  restart: always
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./uploads:/app/uploads

services:
  mysql:
    image: mysql:8.0
    container_name: wecandoit-mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: wecandoit
      MYSQL_USER: wecandoit
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wecandoit-redis-prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-stable:
    <<: *backend-common
    image: ${STABLE_IMAGE:-wecandoit-backend-prod:stable}
    container_name: wecandoit-backend-stable
    environment:
      <<: *backend-environment
      SCHEDULING_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "127.0.0.1:8080:8080"

  backend-canary:
    <<: *backend-common
    image: ${CANARY_IMAGE:-wecandoit-backend-prod:canary}
    container_name: wecandoit-backend-canary
    environment:
      <<: *backend-environment
      SCHEDULING_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  mysql-data:
  redis-data:
