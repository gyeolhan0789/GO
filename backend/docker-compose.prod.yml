name: wecandoit-backend-prod

x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wecandoit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  SPRING_DATASOURCE_USERNAME: wecandoit
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  STORAGE_ROOT_PATH: /app/uploads
  JWT_SECRET: ${JWT_SECRET}

x-backend-common: &backend-common
  restart: always
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./uploads:/app/uploads
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "3"
  healthcheck:
    # eclipse-temurin:21-jre에 curl이 있음을 확인했다(docker run으로 직접 검증).
    # management 포트(9091, 미publish)의 /actuator/health를 실제로 호출해 응답까지 확인한다 —
    # TCP 연결만 보는 것과 달리 앱이 응답 불가 상태에 빠져도 소켓만 열려 있으면 통과하는
    # 오탐을 막는다.
    test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/actuator/health"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 60s
  # 호스트 메모리 고갈 시 OOM-killer가 prod backend부터 죽이지 않도록 우선순위를 낮춘다.
  # JVM 힙 크기는 바꾸지 않는다(mem_limit과 달리 커널의 kill 대상 선택만 재지정한다).
  oom_score_adj: -500

services:
  mysql:
    image: mysql:8.0
    container_name: wecandoit-mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: wecandoit
      MYSQL_USER: wecandoit
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # prod backend(-500)보다는 낮지만 dev backend보다는 높은 우선순위를 준다 — backend를
    # 보호한 결과로 mysql이 다음 표적이 되는 것을 막는 등급 구조(oom_score_adj: -500).
    oom_score_adj: -300

  redis:
    image: redis:7-alpine
    container_name: wecandoit-redis-prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-stable:
    <<: *backend-common
    image: ${STABLE_IMAGE:-wecandoit-backend-prod:stable}
    container_name: wecandoit-backend-stable
    environment:
      <<: *backend-environment
      SCHEDULING_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "127.0.0.1:8080:8080"

  backend-canary:
    <<: *backend-common
    image: ${CANARY_IMAGE:-wecandoit-backend-prod:canary}
    container_name: wecandoit-backend-canary
    environment:
      <<: *backend-environment
      SCHEDULING_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  mysql-data:
  redis-data:
