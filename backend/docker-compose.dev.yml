name: wecandoit-backend-dev

services:
  mysql:
    image: mysql:8.0
    container_name: wecandoit-mysql-dev
    restart: always
    environment:
      MYSQL_DATABASE: wecandoit
      MYSQL_USER: wecandoit
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wecandoit-redis-dev
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    image: wecandoit-backend-dev
    container_name: wecandoit-backend-dev
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      default:
      edge:
        aliases:
          - wecandoit-backend-dev
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      # eclipse-temurin:21-jre에 curl이 있음을 확인했다(docker run으로 직접 검증).
      # management 포트(9091, 미publish)의 /actuator/health를 실제로 호출해 응답까지 확인한다 —
      # TCP 연결만 보는 것과 달리 앱이 응답 불가 상태에 빠져도 소켓만 열려 있으면 통과하는
      # 오탐을 막는다.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s

volumes:
  mysql-dev-data:
  redis-dev-data:

networks:
  edge:
    name: wecandoit-edge
    external: true
