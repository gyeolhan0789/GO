server {
    listen 80;
    listen [::]:80;
    server_name admin.i15a506.p.ssafy.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.i15a506.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/admin.i15a506.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.i15a506.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/wecandoit-admin/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
