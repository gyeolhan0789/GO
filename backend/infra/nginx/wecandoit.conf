upstream backend_prod {
    include /etc/nginx/snippets/wecandoit-backend-upstream.conf;
}

log_format backend_upstream escape=json
    '$time_iso8601\t$remote_addr\t$request\t$status\t$request_time\t'
    '$upstream_addr\t$upstream_status\t$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name i15a506.p.ssafy.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name i15a506.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15a506.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15a506.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /dev/admin-ui {
        return 301 /dev/admin-ui/;
    }
    location = /dev/admin-ui/ {
        root /var/www/wecandoit-admin/dev/current;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /dev/admin-ui/assets/ {
        rewrite ^/dev/admin-ui/assets/(.*)$ /assets/$1 break;
        root /var/www/wecandoit-admin/dev/current;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /dev/admin-ui/ {
        rewrite ^/dev/admin-ui/(.*)$ /$1 break;
        root /var/www/wecandoit-admin/dev/current;
        try_files $uri $uri/ /dev/admin-ui/index.html;
    }
    location = /ai/dev {
        return 301 /ai/dev/;
    }
    location ^~ /ai/dev/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    location = /ai {
        return 301 /ai/;
    }
    location ^~ /ai/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    location /dev/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /dev;
    }

    location = /admin-ui {
        return 301 /admin-ui/;
    }

    location = /admin-ui/ {
        root /var/www/wecandoit-admin/prod/current;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /admin-ui/assets/ {
        rewrite ^/admin-ui/assets/(.*)$ /assets/$1 break;
        root /var/www/wecandoit-admin/prod/current;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /admin-ui/ {
        rewrite ^/admin-ui/(.*)$ /$1 break;
        root /var/www/wecandoit-admin/prod/current;
        try_files $uri $uri/ /admin-ui/index.html;
    }

    # Grafana Live/Explore가 스트리밍에 WebSocket을 쓴다. 이 서버 블록에는 다른 위치에서
    # 재사용할 $connection_upgrade map이 없으므로(nginx.conf가 이 저장소 밖에 있다) 조건부
    # Connection 헤더 대신 고정값 "upgrade"를 쓴다 — 이 두 location에만 영향이 있다.
    location ^~ /grafana/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /grafana-dev/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://backend_prod;
        access_log /var/log/nginx/wecandoit-backend-access.log backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
