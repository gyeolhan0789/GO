location = /admin-ui {
    return 301 /admin-ui/;
}

location = /admin-ui/ {
    root /var/www/wecandoit-admin/current;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location ^~ /admin-ui/assets/ {
    rewrite ^/admin-ui/assets/(.*)$ /assets/$1 break;
    root /var/www/wecandoit-admin/current;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /admin-ui/ {
    rewrite ^/admin-ui/(.*)$ /$1 break;
    root /var/www/wecandoit-admin/current;
    try_files $uri $uri/ /admin-ui/index.html;
}
