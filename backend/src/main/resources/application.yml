spring:
  application:
    name: backend
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

storage:
  root-path: ${STORAGE_ROOT_PATH:./uploads}

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health, prometheus

observability:
  http:
    enabled: true
    max-body-length: 2000
  query:
    enabled: true
