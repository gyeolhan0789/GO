spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wecandoit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: wecandoit
    password: wecandoit1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: local-dev-only-jwt-secret-key-please-change-me-1234567890
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

  sql:
    init:
      mode: always
      data-locations: classpath:db/local/data.sql

# todo: 실제 아이디 값으로 변경 필요
oauth:
  providers:
    google:
      client-id: GOOGLE_ANDROID_CLIENT_ID_HERE
      jwk-uri: https://www.googleapis.com/oauth2/v3/certs
    kakao:
      client-id: KAKAO_REST_API_KEY_HERE
      jwk-uri: https://kauth.kakao.com/.well-known/jwks.json
