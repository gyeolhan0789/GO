spring:
  datasource:
    url: jdbc:h2:mem:wecandoit-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-only-jwt-secret-key-please-change-me-1234567890
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

ai-server:
  base-url: http://localhost:8000

storage:
  root-path: build/test-uploads
