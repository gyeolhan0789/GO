name: wecandoit-jenkins

services:
  jenkins:
    image: jenkins-backup:pre-jenkins-prefix
    container_name: jenkins
    user: root
    restart: unless-stopped
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      TZ: Asia/Seoul
      JAVA_OPTS: -Duser.timezone=Asia/Seoul
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - /usr/bin/docker:/usr/bin/docker
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose
      - /home/ubuntu/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      edge:
        aliases:
          - jenkins

networks:
  edge:
    name: wecandoit-edge
    external: true
