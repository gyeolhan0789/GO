user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format backend_upstream escape=json
        '$time_iso8601\t$remote_addr\t$request\t$status\t$request_time\t'
        '$upstream_addr\t$upstream_status\t$upstream_response_time';

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # The application accepts requests up to 5 MB. Keep a small allowance for
    # multipart boundaries so Nginx does not reject a valid 5 MB file first.
    client_max_body_size 6m;

    include /etc/nginx/conf.d/*.conf;
}
