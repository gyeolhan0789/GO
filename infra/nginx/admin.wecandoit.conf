server {
    listen 80;
    listen [::]:80;
    server_name admin.i15a506.p.ssafy.io;
    return 301 https://i15a506.p.ssafy.io/admin-ui$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.i15a506.p.ssafy.io;
    ssl_certificate /etc/letsencrypt/live/admin.i15a506.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.i15a506.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://i15a506.p.ssafy.io/admin-ui$request_uri;
}