upstream backend_prod {
    include /etc/nginx/runtime/backend-upstream.conf;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name i15a506.p.ssafy.io;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name i15a506.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15a506.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15a506.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/admin-ui.conf;
    include /etc/nginx/snippets/ai-dev.conf;
    include /etc/nginx/snippets/jenkins.conf;
    include /etc/nginx/snippets/observability.conf;

    location /ws {
        proxy_pass http://backend_prod;
        access_log /dev/stdout backend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /dev/ {
        set $dev_backend wecandoit-backend-dev:8080;
        rewrite ^/dev/(.*)$ /$1 break;
        proxy_pass http://$dev_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /dev;
    }

    location / {
        proxy_pass http://backend_prod;
        access_log /dev/stdout backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

# Jenkins uses this internal endpoint to validate the currently active upstream
# without depending on the temporary Host port mapping or TLS.
server {
    listen 8088;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /ws {
        proxy_pass http://backend_prod;
        access_log /dev/stdout backend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host i15a506.p.ssafy.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host i15a506.p.ssafy.io;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        proxy_pass http://backend_prod;
        access_log /dev/stdout backend_upstream;
        proxy_set_header Host i15a506.p.ssafy.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host i15a506.p.ssafy.io;
        proxy_set_header X-Forwarded-Port 443;
    }
}
